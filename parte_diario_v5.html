             onchange="admDatos[${i}]['${k}']=this.value"></td>`).join('');
    const botones = (c.act
      ? `<button class="btn-mini ${f[c.act] ? 'btn-off' : 'btn-ok'}"
           onclick="admActivar(${i})">${f[c.act] ? 'Desactivar' : 'Activar'}</button> ` : '')
      + `<button class="btn-mini btn-neutro" onclick="admGuardarFila(${i})">Guardar</button>`;
    return `<tr${inactivo}>${celdas}<td>${botones}</td></tr>`;
  }).join('');

  const nuevos = c.cols.map(([k, t, flag]) => flag === 2 ? ''
    : `<td><input id="nv-${k}" placeholder="${t}"></td>`).join('');

  $('adm-cat-cuerpo').innerHTML = `
    <div class="hist-info">${admDatos.length} registros</div>
    <div class="adm-wrap"><table class="adm-tabla">
      <thead><tr>${c.cols.map(x => `<th>${x[1]}</th>`).join('')}<th>Acciones</th></tr></thead>
      <tbody>
        <tr style="background:#eef2f9">${nuevos}
          <td><button class="btn-mini btn-ok" onclick="admAgregar()">Agregar</button></td></tr>
        ${filas}
      </tbody></table></div>
    <p class="hist-info" style="margin-top:8px">
      Desactivar no borra nada: el registro deja de aparecer en el formulario
      pero los partes viejos lo siguen mostrando.</p>`;
}

async function admGuardarFila(i) {
  const c = CATALOGOS[admCatalogo];
  const f = admDatos[i];
  const cambios = {};
  c.cols.forEach(([k, , flag]) => { if (flag !== 1 && flag !== 2) cambios[k] = f[k]; });
  await admEscribir(() => sb.from(admCatalogo).update(cambios).eq(c.pk, f[c.pk]).select());
}

async function admActivar(i) {
  const c = CATALOGOS[admCatalogo];
  const f = admDatos[i];
  await admEscribir(() => sb.from(admCatalogo)
    .update({ [c.act]: !f[c.act] }).eq(c.pk, f[c.pk]).select(), true);
}

async function admAgregar() {
  const c = CATALOGOS[admCatalogo];
  const fila = {};
  let falta = null;
  c.cols.forEach(([k, t, flag]) => {
    if (flag === 2) return;
    const v = ($('nv-' + k).value || '').trim();
    if (!v && flag === 1) falta = t;
    if (v) fila[k] = (k === 'orden') ? parseInt(v, 10) : v;
  });
  if (falta) return toast('Falta completar: ' + falta, 'warning');
  if (!Object.keys(fila).length) return toast('Completá los datos', 'warning');
  // La clave de una obra es codigo_nombre: se arma sola si no la pusieron
  if (admCatalogo === 'obras' && !fila.clave && fila.codigo && fila.nombre) {
    fila.clave = fila.codigo + '_' + fila.nombre;
  }
  await admEscribir(() => sb.from(admCatalogo).insert(fila).select(), true);
}

async function admEscribir(fn, recargar) {
  mostrarCarga('Guardando...');
  try {
    const { data, error } = await fn();
    if (error) throw error;
    if (!data || !data.length) throw new Error('La base rechazó el cambio (permisos)');
    ocultarCarga();
    toast('Guardado', 'success');
    if (recargar) admCatalogos();
    // Los catálogos cambiaron: la próxima apertura los tiene que releer
    localStorage.removeItem('catalogos');
  } catch (e) {
    ocultarCarga();
    toast('No se pudo guardar: ' + (e.message || e), 'error');
  }
}

// ── Usuarios ──────────────────────────────────────────────────────
async function admUsuarios() {
  $('adm-contenido').innerHTML = '<div class="empty-state">Cargando...</div>';
  try {
    const { data, error } = await sb.from('perfiles').select('*').order('nombre');
    if (error) throw error;
    admDatos = data || [];

    const obrasOps = (cat.obras || []);
    const filas = admDatos.map((u, i) => {
      const inactivo = u.activo ? '' : ' class="inactivo"';
      const roles = ['operador', 'admin_obra', 'admin_central'].map(r =>
        `<option value="${r}"${u.rol === r ? ' selected' : ''}>${etiquetaRol(r)}</option>`).join('');
      return `<tr${inactivo}>
        <td>${u.cedula}</td>
        <td><input value="${String(u.nombre).replace(/"/g,'&quot;')}"
             onchange="admDatos[${i}].nombre=this.value"></td>
        <td><select onchange="admDatos[${i}].rol=this.value;admUsuarioObras(${i})">${roles}</select></td>
        <td id="obras-${i}">${u.rol === 'admin_obra'
            ? `<button class="btn-mini btn-neutro" onclick="admElegirObras(${i})">
                 ${(u.obras || []).length} obra(s)</button>`
            : '<span class="campo-sistema">—</span>'}</td>
        <td>
          <button class="btn-mini ${u.activo ? 'btn-off' : 'btn-ok'}" onclick="admUsuarioActivo(${i})">
            ${u.activo ? 'Desactivar' : 'Activar'}</button>
          <button class="btn-mini btn-neutro" onclick="admGuardarUsuario(${i})">Guardar</button>
        </td></tr>`;
    }).join('');

    $('adm-contenido').innerHTML = `
      <div class="aviso-caja">
        Para <b>dar de alta</b> un usuario nuevo hace falta una clave de administrador
        que no puede vivir dentro de esta app. Se hace desde el panel de Supabase
        (Authentication → Add user) o con el script <code>crear_usuarios.py</code>.
        Desde acá se administra todo lo demás: rol, obras, nombre y activación.
      </div>
      <div class="hist-info">${admDatos.length} usuarios</div>
      <div class="adm-wrap"><table class="adm-tabla">
        <thead><tr><th>Cédula</th><th>Nombre</th><th>Rol</th><th>Obras</th><th>Acciones</th></tr></thead>
        <tbody>${filas}</tbody></table></div>
      <p class="hist-info" style="margin-top:8px">
        Desactivar a alguien le impide entrar, pero sus partes quedan intactos.</p>`;
  } catch (e) {
    $('adm-contenido').innerHTML = `<div class="empty-state">No se pudo cargar: ${e.message}</div>`;
  }
}

function admUsuarioObras(i) {
  const u = admDatos[i];
  $('obras-' + i).innerHTML = u.rol === 'admin_obra'
    ? `<button class="btn-mini btn-neutro" onclick="admElegirObras(${i})">
         ${(u.obras || []).length} obra(s)</button>`
    : '<span class="campo-sistema">—</span>';
}

function admElegirObras(i) {
  const u = admDatos[i];
  const sel = new Set(u.obras || []);
  $('detalle-titulo').textContent = 'Obras de ' + u.nombre;
  $('detalle-body').innerHTML = (cat.obras || []).map(o => `
    <label style="display:flex;gap:9px;align-items:center;padding:7px 0;
                  border-bottom:1px solid var(--gris-fondo);font-size:13px">
      <input type="checkbox" value="${o.v}" ${sel.has(o.v) ? 'checked' : ''}
             onchange="admToggleObra(${i},this.value,this.checked)"
             style="width:18px;height:18px">
      <span>${o.t}</span></label>`).join('')
    + `<button class="btn-submit" style="width:100%;margin-top:12px"
         onclick="cerrarDetalle();admUsuarioObras(${i})">Listo</button>`;
  $('btn-editar-parte').style.display = 'none';
  $('modal-detalle').classList.add('show');
}

function admToggleObra(i, obra, marcado) {
  const u = admDatos[i];
  u.obras = u.obras || [];
  if (marcado) { if (!u.obras.includes(obra)) u.obras.push(obra); }
  else u.obras = u.obras.filter(o => o !== obra);
}

async function admGuardarUsuario(i) {
  const u = admDatos[i];
  if (u.rol === 'admin_obra' && !(u.obras || []).length) {
    return toast('Un admin de obra sin obras asignadas no vería ningún parte', 'warning');
  }
  mostrarCarga('Guardando...');
  try {
    const { data, error } = await sb.from('perfiles')
      .update({ nombre: u.nombre, rol: u.rol, obras: u.obras || [] })
      .eq('id', u.id).select();
    if (error) throw error;
    if (!data || !data.length) throw new Error('La base rechazó el cambio');
    ocultarCarga(); toast('Usuario actualizado', 'success');
  } catch (e) { ocultarCarga(); toast('No se pudo guardar: ' + e.message, 'error'); }
}

async function admUsuarioActivo(i) {
  const u = admDatos[i];
  if (u.id === sesion.id) return toast('No podés desactivarte a vos mismo', 'warning');
  mostrarCarga('Guardando...');
  try {
    const { error } = await sb.from('perfiles').update({ activo: !u.activo }).eq('id', u.id);
    if (error) throw error;
    ocultarCarga(); admUsuarios();
  } catch (e) { ocultarCarga(); toast('No se pudo guardar: ' + e.message, 'error'); }
}


// ── Constructor del formulario ────────────────────────────────────
//
// Lo que reemplaza al editor de JotForm. Los campos que la app necesita
// para funcionar están marcados: se pueden renombrar, reordenar, hacer
// obligatorios u ocultar, pero no borrar — la base lo impide.
let admSecciones = [], admCampos = [];

async function admFormulario() {
  $('adm-contenido').innerHTML = '<div class="empty-state">Cargando...</div>';
  try {
    const [sec, cam] = await Promise.all([
      sb.from('form_secciones').select('*').order('orden'),
      sb.from('form_campos').select('*').order('orden')
    ]);
    if (sec.error) throw sec.error;
    if (cam.error) throw cam.error;
    admSecciones = sec.data || [];
    admCampos = cam.data || [];
    pintarFormulario();
  } catch (e) {
    $('adm-contenido').innerHTML = `<div class="empty-state">No se pudo cargar: ${e.message}</div>`;
  }
}

const TIPOS_CAMPO = ['texto','textarea','numero','fecha','fecha_hora','si_no','select',
                     'catalogo','foto','firma','calculado','items_obra','combustible','viajes'];

function pintarFormulario() {
  const esc = v => String(v == null ? '' : v).replace(/"/g, '&quot;');

  const bloques = admSecciones.map(s => {
    const campos = admCampos.filter(c => c.seccion_id === s.id);
    const filas = campos.map(c => {
      const i = admCampos.indexOf(c);
      const cond = c.visible_si
        ? `<span class="campo-sistema">solo si ${c.visible_si.campo} ${
             c.visible_si.familia_en ? 'es ' + c.visible_si.familia_en.join('/')
                                     : '= ' + c.visible_si.igual}</span>`
        : '<span class="campo-sistema">siempre</span>';
      return `<tr${c.activo ? '' : ' class="inactivo"'}>
        <td><input value="${esc(c.etiqueta)}" onchange="admCampos[${i}].etiqueta=this.value"></td>
        <td>${c.es_sistema
            ? `${c.tipo} <span class="campo-sistema">(del sistema)</span>`
            : `<select onchange="admCampos[${i}].tipo=this.value">` +
              TIPOS_CAMPO.map(t => `<option${t === c.tipo ? ' selected' : ''}>${t}</option>`).join('') +
              `</select>`}</td>
        <td><input type="number" style="width:62px" value="${c.orden}"
             onchange="admCampos[${i}].orden=parseInt(this.value,10)"></td>
        <td style="text-align:center"><input type="checkbox" ${c.requerido ? 'checked' : ''}
             onchange="admCampos[${i}].requerido=this.checked" style="width:18px;height:18px"></td>
        <td>${cond}</td>
        <td>
          <button class="btn-mini ${c.activo ? 'btn-off' : 'btn-ok'}"
            onclick="admCampoActivo(${i})">${c.activo ? 'Ocultar' : 'Mostrar'}</button>
          <button class="btn-mini btn-neutro" onclick="admGuardarCampo(${i})">Guardar</button>
          ${c.es_sistema ? '' :
            `<button class="btn-mini btn-off" onclick="admBorrarCampo(${i})">Borrar</button>`}
        </td></tr>`;
    }).join('');

    return `<div class="card">
      <div class="card-header">${s.icono || ''} ${s.titulo}
        <span style="margin-left:auto;font-weight:400;font-size:12px">
          paso ${s.orden} · ${campos.length} campos</span></div>
      <div class="card-body" style="padding:0">
        <table class="adm-tabla">
          <thead><tr><th>Etiqueta</th><th>Tipo</th><th>Orden</th>
            <th>Oblig.</th><th>Se muestra</th><th>Acciones</th></tr></thead>
          <tbody>${filas}</tbody></table>
        <div style="padding:11px">
          <button class="btn-mini btn-ok" onclick="admNuevoCampo(${s.id})">
            + Agregar campo a este paso</button></div>
      </div></div>`;
  }).join('');

  $('adm-contenido').innerHTML = `
    <div class="aviso-caja">
      Los campos marcados <b>(del sistema)</b> los necesita la app para funcionar.
      Se pueden renombrar, reordenar, hacer obligatorios u ocultar, pero no borrar.
      Los que agregues vos se guardan sin tocar la estructura de la base, así que
      no rompen Power BI.
    </div>${bloques}`;
}

async function admCampoActivo(i) {
  const c = admCampos[i];
  mostrarCarga('Guardando...');
  try {
    const { error } = await sb.from('form_campos')
      .update({ activo: !c.activo }).eq('id', c.id);
    if (error) throw error;
    ocultarCarga(); admFormularioCambio(); admFormulario();
  } catch (e) { ocultarCarga(); toast('No se pudo: ' + e.message, 'error'); }
}

async function admGuardarCampo(i) {
  const c = admCampos[i];
  mostrarCarga('Guardando...');
  try {
    const { data, error } = await sb.from('form_campos').update({
      etiqueta: c.etiqueta, orden: c.orden, requerido: c.requerido, tipo: c.tipo
    }).eq('id', c.id).select();
    if (error) throw error;
    if (!data || !data.length) throw new Error('La base rechazó el cambio');
    ocultarCarga(); toast('Campo actualizado', 'success'); admFormularioCambio();
  } catch (e) {
    ocultarCarga();
    // El mensaje del trigger explica por qué, en castellano
    toast(e.message || 'No se pudo guardar', 'error');
  }
}

async function admBorrarCampo(i) {
  const c = admCampos[i];
  if (!confirm(`¿Borrar el campo "${c.etiqueta}"?\n\nLos partes ya cargados conservan `
             + `el dato, pero deja de pedirse.`)) return;
  mostrarCarga('Borrando...');
  try {
    const { error } = await sb.from('form_campos').delete().eq('id', c.id);
    if (error) throw error;
    ocultarCarga(); toast('Campo borrado', 'success'); admFormularioCambio(); admFormulario();
  } catch (e) { ocultarCarga(); toast(e.message || 'No se pudo borrar', 'error'); }
}

async function admNuevoCampo(seccionId) {
  const etiqueta = prompt('¿Cómo se va a llamar el campo?');
  if (!etiqueta) return;
  const tipo = prompt('Tipo: texto, numero, fecha, si_no, textarea', 'texto');
  if (!tipo || !TIPOS_CAMPO.includes(tipo)) return toast('Tipo no válido', 'warning');

  // La clave interna se arma del nombre: sin tildes, sin espacios
  const clave = etiqueta.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 40);
  const maxOrden = Math.max(0, ...admCampos
    .filter(c => c.seccion_id === seccionId).map(c => c.orden));

  mostrarCarga('Creando...');
  try {
    const { error } = await sb.from('form_campos').insert({
      seccion_id: seccionId, clave, etiqueta, tipo,
      orden: maxOrden + 1, requerido: false, es_sistema: false
    });
    if (error) throw error;
    ocultarCarga(); toast('Campo creado', 'success'); admFormularioCambio(); admFormulario();
  } catch (e) { ocultarCarga(); toast('No se pudo crear: ' + e.message, 'error'); }
}

// El formulario cambió: hay que redibujarlo y que los celulares lo
// vuelvan a bajar en vez de usar la copia guardada.
function admFormularioCambio() {
  localStorage.removeItem('def_formulario');
  cargarDefinicion().then(() => dibujarFormulario());
}

// ── Reglas de validación ──────────────────────────────────────────
async function admReglas() {
  $('adm-contenido').innerHTML = '<div class="empty-state">Cargando...</div>';
  try {
    const { data, error } = await sb.from('form_reglas').select('*').order('clave');
    if (error) throw error;
    admDatos = data || [];
    const filas = admDatos.map((r, i) => {
      const esBooleana = !r.unidad && (r.valor === 0 || r.valor === 1);
      const control = esBooleana
        ? `<select onchange="admDatos[${i}].valor=parseInt(this.value,10)">
             <option value="1"${r.valor == 1 ? ' selected' : ''}>Activa</option>
             <option value="0"${r.valor == 0 ? ' selected' : ''}>Desactivada</option></select>`
        : `<input type="number" step="0.01" value="${r.valor}" style="width:100px"
             onchange="admDatos[${i}].valor=parseFloat(this.value)">
           <span class="campo-sistema"> ${r.unidad || ''}</span>`;
      return `<tr><td style="max-width:420px;white-space:normal">${r.descripcion}</td>
        <td>${control}</td>
        <td><button class="btn-mini btn-neutro" onclick="admGuardarRegla(${i})">Guardar</button></td>
        </tr>`;
    }).join('');

    $('adm-contenido').innerHTML = `
      <div class="aviso-caja">
        Estos son los límites que la app aplica al validar un parte. Viajan junto
        con el formulario, así que siguen funcionando sin señal. Cambiar uno acá
        lo cambia en todos los celulares sin republicar la app.
      </div>
      <div class="adm-wrap"><table class="adm-tabla">
        <thead><tr><th>Regla</th><th>Valor</th><th></th></tr></thead>
        <tbody>${filas}</tbody></table></div>`;
  } catch (e) {
    $('adm-contenido').innerHTML = `<div class="empty-state">No se pudo cargar: ${e.message}</div>`;
  }
}

async function admGuardarRegla(i) {
  const r = admDatos[i];
  mostrarCarga('Guardando...');
  try {
    const { data, error } = await sb.from('form_reglas')
      .update({ valor: r.valor }).eq('clave', r.clave).select();
    if (error) throw error;
    if (!data || !data.length) throw new Error('La base rechazó el cambio');
    ocultarCarga(); toast('Regla actualizada', 'success'); admFormularioCambio();
  } catch (e) { ocultarCarga(); toast('No se pudo guardar: ' + e.message, 'error'); }
}

// ══════════════════════════════════════════════════════════════════
// UTILIDADES
// ══════════════════════════════════════════════════════════════════
function mostrarPantalla(n) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  $('screen-' + n).classList.add('active');
  $('tab-' + n).classList.add('active');
  if (n === 'historial') cargarHistorial();
  if (n === 'admin') mostrarAdmin(admSolapa);
  window.scrollTo(0, 0);
}

let toastTimer = null;
function toast(msg, tipo) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show ' + (tipo || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3800);
}

function mostrarCarga(txt) { $('loading-text').textContent = txt || 'Cargando...'; $('loading').classList.add('show'); }
function ocultarCarga() { $('loading').classList.remove('show'); }

</script>
